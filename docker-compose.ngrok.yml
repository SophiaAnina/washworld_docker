# Adds an ngrok tunnel for public demos (needs NGROK_AUTHTOKEN in .env).
#   docker compose -f docker-compose.yml -f docker-compose.ngrok.yml up -d ngrok
services:
  ngrok:
    image: ngrok/ngrok:3-alpine
    container_name: washworld_eksamen_ngrok
    command: ["start", "--all", "--config", "/etc/ngrok.yml"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - "127.0.0.1:4040:4040" # ngrok inspector: shows the public URLs
    depends_on:
      - frontend
      - web
    networks:
      - washworld_net
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
